[project]
name = "dnd-hub-backend"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.0,<4.0.0",
    "flask-cors>=5.0.0,<6.0.0",
    "gunicorn>=23.0.0,<24.0.0",
    "supabase>=2.0.0,<3.0.0",
    "anthropic>=0.40.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "ANN",
    "D",
    "RUF",
]
ignore = [
    "ANN101",
    "ANN102",
    "D100",
    "D104",
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]